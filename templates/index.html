<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森林进化论游戏助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3a 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* 初始化面板 */
        .init-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .init-panel h2 {
            color: #1a472a;
            margin-bottom: 20px;
            border-bottom: 2px solid #1a472a;
            padding-bottom: 10px;
        }
        
        .init-form {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }
        
        .form-group {
            flex: 1;
            min-width: 200px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2d5a3a;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus, .form-group select:focus {
            border-color: #1a472a;
            outline: none;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }
        
        button {
            background: #1a472a;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #2d5a3a;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        /* 上半部分：玩家信息 */
        .players-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #1a472a;
            padding-bottom: 10px;
        }
        
        .section-header h2 {
            color: #1a472a;
        }
        
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .player-card {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            border-left: 5px solid #1a472a;
            transition: transform 0.2s;
        }
        
        .player-card.dead {
            opacity: 0.6;
            border-left-color: #999;
            background: #e0e0e0;
        }
        
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .player-no {
            background: #1a472a;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        .player-identity {
            color: #666;
        }
        
        .player-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .stat-item {
            background: white;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #1a472a;
        }
        
        .player-skills {
            background: white;
            padding: 8px;
            border-radius: 5px;
            font-size: 13px;
            margin-bottom: 10px;
        }
        
        .skill-tag {
            display: inline-block;
            background: #1a472a;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            margin: 2px;
            font-size: 12px;
        }
        
        .blood-modify {
            display: flex;
            gap: 5px;
        }
        
        .blood-modify input {
            flex: 1;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .blood-modify button {
            padding: 5px 10px;
            font-size: 14px;
        }
        
        .small-btn {
            padding: 5px 10px;
            font-size: 14px;
        }
        
        /* 下半部分：轮次管理 */
        .round-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .tab-container {
            display: flex;
            gap: 2px;
            background: #ddd;
            border-radius: 10px 10px 0 0;
            overflow: hidden;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            background: #eee;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .tab.active {
            background: #1a472a;
            color: white;
        }
        
        .tab-content {
            background: white;
            padding: 20px;
            border-radius: 0 0 10px 10px;
            min-height: 400px;
        }
        
        /* 进化卡设置面板 */
        .cards-setup {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .round-cards {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
        }
        
        .round-cards h4 {
            color: #1a472a;
            margin-bottom: 10px;
        }
        
        .card-checkbox {
            display: block;
            margin: 5px 0;
        }
        
        /* 拍卖面板 */
        .auction-panel {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .auction-item {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* 消息提示 */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
        }
        
        .message.success {
            border-left: 5px solid #1a472a;
        }
        
        .message.error {
            border-left: 5px solid #c00;
        }
        
        /* 捕食面板 */
        .hunt-panel, .trade-panel {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .inline-form {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .inline-form input, .inline-form select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        /* 当前轮次信息 */
        .round-info {
            background: #1a472a;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 初始化面板 -->
        <div class="init-panel">
            <h2>🎮 游戏初始化</h2>
            <div class="init-form">
                <div class="form-group">
                    <label>玩家人数：</label>
                    <input type="number" id="playerCount" min="6" value="6">
                </div>
                <div class="form-group">
                    <label>游戏模式：</label>
                    <select id="gameMode">
                        <option value="standard">标准模式</option>
                        <option value="noBlood">无血量中控模式</option>
                    </select>
                </div>
                <div class="form-group checkbox-group">
                    <label>使用轮次管理：</label>
                    <input type="checkbox" id="useRoundManager" checked>
                </div>
                <button onclick="initGame()">开始游戏</button>
            </div>
        </div>

        <!-- 玩家信息上半部分 -->
        <div class="players-section" id="playersSection" style="display: none;">
            <div class="section-header">
                <h2>👥 玩家状态</h2>
                <button onclick="refreshPlayers()" class="small-btn">刷新</button>
            </div>
            <div id="playersGrid" class="players-grid"></div>
        </div>

        <!-- 轮次管理下半部分 -->
        <div class="round-section" id="roundSection" style="display: none;">
            <div class="tab-container">
                <div class="tab active" onclick="switchTab('setup')" id="tabSetup">⚙️ 进化卡设置</div>
                <div class="tab" onclick="switchTab('round')" id="tabRound">🔄 轮次控制</div>
                <div class="tab" onclick="switchTab('hunt')" id="tabHunt">🦁 捕食交易</div>
                <div class="tab" onclick="switchTab('auction')" id="tabAuction">💰 拍卖行</div>
            </div>
            
            <!-- 进化卡设置面板 -->
            <div id="tabSetupContent" class="tab-content">
                <div class="cards-setup">
                    <div class="round-cards">
                        <h4>第1轮进化卡</h4>
                        <label class="card-checkbox"><input type="checkbox" value="1-1"> 1-1 鹰眼</label>
                        <label class="card-checkbox"><input type="checkbox" value="1-2"> 1-2 尖刺</label>
                        <label class="card-checkbox"><input type="checkbox" value="1-3"> 1-3 百毒不侵</label>
                        <label class="card-checkbox"><input type="checkbox" value="1-4"> 1-4 基因突变</label>
                        <label class="card-checkbox"><input type="checkbox" value="1-5"> 1-5 嗜血</label>
                        <label class="card-checkbox"><input type="checkbox" value="1-6"> 1-6 剧毒</label>
                    </div>
                    <div class="round-cards">
                        <h4>第2轮进化卡</h4>
                        <label class="card-checkbox"><input type="checkbox" value="2-1"> 2-1 两栖</label>
                        <label class="card-checkbox"><input type="checkbox" value="2-2"> 2-2 寄生</label>
                        <label class="card-checkbox"><input type="checkbox" value="2-3"> 2-3 大胃王</label>
                        <label class="card-checkbox"><input type="checkbox" value="2-4"> 2-4 闪避</label>
                        <label class="card-checkbox"><input type="checkbox" value="2-5"> 2-5 物种消亡</label>
                        <label class="card-checkbox"><input type="checkbox" value="2-6"> 2-6 断尾</label>
                        <label class="card-checkbox"><input type="checkbox" value="2-7"> 2-7 森林权杖</label>
                    </div>
                    <div class="round-cards">
                        <h4>第3轮进化卡</h4>
                        <label class="card-checkbox"><input type="checkbox" value="3-1"> 3-1 巨大化</label>
                        <label class="card-checkbox"><input type="checkbox" value="3-2"> 3-2 食腐</label>
                        <label class="card-checkbox"><input type="checkbox" value="3-3"> 3-3 三头犬</label>
                        <label class="card-checkbox"><input type="checkbox" value="3-4"> 3-4 狼王号召</label>
                        <label class="card-checkbox"><input type="checkbox" value="3-5"> 3-5 替罪羊</label>
                        <label class="card-checkbox"><input type="checkbox" value="3-6"> 3-6 冬眠</label>
                        <label class="card-checkbox"><input type="checkbox" value="3-7"> 3-7 天敌血统</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>自由阶段时间（分钟）：</label>
                    <input type="number" id="freePhaseMinutes" min="1" value="15">
                </div>
                <button onclick="initRoundManager()">初始化轮次管理器</button>
            </div>
            
            <!-- 轮次控制面板 -->
            <div id="tabRoundContent" class="tab-content" style="display: none;">
                <div class="round-info" id="roundInfo">当前轮次: 未开始</div>
                
                <div class="hunt-panel">
                    <h4>轮次控制</h4>
                    <div class="inline-form">
                        <select id="roundSelect">
                            <option value="1">第1轮</option>
                            <option value="2">第2轮</option>
                            <option value="3">第3轮</option>
                            <option value="4">第4轮</option>
                        </select>
                        <button onclick="startRound()">开始轮次</button>
                        <button onclick="freePhase()">自由阶段</button>
                        <button onclick="predationPhase()">捕食阶段</button>
                        <button onclick="evolutionPhase()">进化阶段</button>
                        <button onclick="endRound()">结束轮次</button>
                    </div>
                </div>
            </div>
            
            <!-- 捕食交易面板 -->
            <div id="tabHuntContent" class="tab-content" style="display: none;">
                <div class="hunt-panel">
                    <h4>🦁 捕食</h4>
                    <div class="inline-form">
                        <input type="number" id="hunterNo" placeholder="捕食方编号" min="1">
                        <input type="number" id="preyNo" placeholder="被捕食方编号" min="1">
                        <input type="number" id="huntAmount" placeholder="捕食血量" min="1" value="2">
                        <button onclick="executeHunt()">执行捕食</button>
                    </div>
                </div>
                
                <div class="trade-panel">
                    <h4>💱 交易</h4>
                    <div class="inline-form">
                        <input type="number" id="trader1" placeholder="交易方1" min="1">
                        <input type="number" id="trader2" placeholder="交易方2" min="1">
                        <input type="number" id="tradeAmount" placeholder="交易血量" min="1" value="1">
                        <button onclick="executeTrade()">执行交易</button>
                    </div>
                </div>
                
                <div class="hunt-panel">
                    <h4>💉 修改血量</h4>
                    <div class="inline-form">
                        <input type="number" id="modPlayer" placeholder="玩家编号" min="1">
                        <input type="number" id="modAmount" placeholder="修改数值">
                        <input type="text" id="modNote" placeholder="备注">
                        <button onclick="modifyBlood()">修改</button>
                    </div>
                    <small>正数增加，负数减少</small>
                </div>
            </div>
            
            <!-- 拍卖行面板 -->
            <div id="tabAuctionContent" class="tab-content" style="display: none;">
                <div id="auctionCards" class="auction-panel">
                    <h4>当前轮次可拍卖的进化卡</h4>
                    <div id="auctionList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息提示 -->
    <div id="message" class="message"></div>

    <script>
        let currentTab = 'setup';
        let currentRound = 0;
        
        // 显示消息
        function showMessage(text, type = 'success') {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 3000);
        }
        
        // 切换标签页
        function switchTab(tab) {
            currentTab = tab;
            
            // 更新标签样式
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('active');
            
            // 显示对应内容
            document.getElementById('tabSetupContent').style.display = tab === 'setup' ? 'block' : 'none';
            document.getElementById('tabRoundContent').style.display = tab === 'round' ? 'block' : 'none';
            document.getElementById('tabHuntContent').style.display = tab === 'hunt' ? 'block' : 'none';
            document.getElementById('tabAuctionContent').style.display = tab === 'auction' ? 'block' : 'none';
            
            if (tab === 'auction') {
                loadAuctionCards();
            }
        }
        
        // 初始化游戏
        async function initGame() {
            const playerCount = document.getElementById('playerCount').value;
            const gameMode = document.getElementById('gameMode').value;
            const useRoundManager = document.getElementById('useRoundManager').checked;
            
            const noBloodMode = gameMode === 'noBlood';
            
            const response = await fetch('/api/init_game', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    player_count: parseInt(playerCount),
                    no_blood_mode: noBloodMode
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showMessage('游戏初始化成功');
                document.getElementById('playersSection').style.display = 'block';
                
                if (useRoundManager) {
                    document.getElementById('roundSection').style.display = 'block';
                    switchTab('setup');
                }
                
                updatePlayersGrid(data.players);
            } else {
                showMessage(data.message, 'error');
            }
        }
        
        // 初始化轮次管理器
        async function initRoundManager() {
            // 获取选中的进化卡
            const round1Cards = [];
            const round2Cards = [];
            const round3Cards = [];
            
            document.querySelectorAll('.round-cards input').forEach(cb => {
                if (cb.checked) {
                    const value = cb.value;
                    if (value.startsWith('1-')) round1Cards.push(value);
                    else if (value.startsWith('2-')) round2Cards.push(value);
                    else if (value.startsWith('3-')) round3Cards.push(value);
                }
            });
            
            const freePhaseMinutes = document.getElementById('freePhaseMinutes').value;
            
            const response = await fetch('/api/init_round_manager', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    round1_cards: round1Cards,
                    round2_cards: round2Cards,
                    round3_cards: round3Cards,
                    free_phase_minutes: parseInt(freePhaseMinutes)
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showMessage('轮次管理器初始化成功');
                switchTab('round');
            } else {
                showMessage(data.message, 'error');
            }
        }
        
        // 开始轮次
        async function startRound() {
            const roundNum = document.getElementById('roundSelect').value;
            
            const response = await fetch('/api/start_round', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({round_num: parseInt(roundNum)})
            });
            
            const data = await response.json();
            
            if (data.success) {
                showMessage(data.message);
                currentRound = data.current_round;
                document.getElementById('roundInfo').textContent = `当前轮次: 第${currentRound}大轮`;
                await refreshPlayers();
            } else {
                showMessage(data.message, 'error');
            }
        }
        
        // 自由阶段
        function freePhase() {
            showMessage('自由阶段开始，请使用交易、修改血量等功能');
        }
        
        // 捕食阶段
        function predationPhase() {
            showMessage('捕食阶段开始，请使用捕食功能');
            switchTab('hunt');
        }
        
        // 进化阶段
        function evolutionPhase() {
            showMessage('进化阶段开始');
            switchTab('auction');
        }
        
        // 结束轮次
        function endRound() {
            showMessage(`第${currentRound}轮结束`);
            currentRound++;
            if (currentRound <= 4) {
                document.getElementById('roundInfo').textContent = `当前轮次: 第${currentRound}大轮 (准备中)`;
            }
        }
        
        // 刷新玩家列表
        async function refreshPlayers() {
            const response = await fetch('/api/get_players');
            const data = await response.json();
            if (data.success) {
                updatePlayersGrid(data.players);
            }
        }
        
        // 更新玩家网格
        function updatePlayersGrid(players) {
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = '';
            
            players.forEach(player => {
                const card = document.createElement('div');
                card.className = `player-card ${player.is_alive ? '' : 'dead'}`;
                
                const skillsHtml = player.skills.map(s => 
                    `<span class="skill-tag">${s}</span>`
                ).join('');
                
                card.innerHTML = `
                    <div class="player-header">
                        <span class="player-no">玩家 ${player.no}</span>
                        <span class="player-identity">${player.display}</span>
                    </div>
                    <div class="player-stats">
                        <div class="stat-item">
                            <div class="stat-label">血量</div>
                            <div class="stat-value">${player.blood}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">交易血量</div>
                            <div class="stat-value">${player.trade}</div>
                        </div>
                    </div>
                    <div class="player-skills">
                        ${skillsHtml || '无技能'}
                    </div>
                    <div class="blood-modify">
                        <input type="number" id="blood_${player.no}" placeholder="修改数值" value="1">
                        <button onclick="modifyPlayerBlood(${player.no})" class="small-btn">修改</button>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        // 修改玩家血量
        async function modifyPlayerBlood(playerNo) {
            const input = document.getElementById(`blood_${playerNo}`);
            const amount = parseInt(input.value);
            
            const response = await fetch('/api/modify_blood', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    player_no: playerNo,
                    amount: amount
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showMessage(`玩家${playerNo}血量修改成功`);
                updatePlayersGrid(data.players);
            } else {
                showMessage(data.message, 'error');
            }
        }
        
        // 执行捕食
        async function executeHunt() {
            const hunter = document.getElementById('hunterNo').value;
            const prey = document.getElementById('preyNo').value;
            const amount = document.getElementById('huntAmount').value;
            
            const response = await fetch('/api/hunt', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    hunter: parseInt(hunter),
                    prey: parseInt(prey),
                    amount: parseInt(amount)
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showMessage('捕食执行成功');
                updatePlayersGrid(data.players);
            } else {
                showMessage(data.message, 'error');
            }
        }
        
        // 执行交易
        async function executeTrade() {
            const p1 = document.getElementById('trader1').value;
            const p2 = document.getElementById('trader2').value;
            const amount = document.getElementById('tradeAmount').value;
            
            const response = await fetch('/api/trade', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    player1: parseInt(p1),
                    player2: parseInt(p2),
                    amount: parseInt(amount)
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showMessage('交易成功');
                updatePlayersGrid(data.players);
            } else {
                showMessage(data.message, 'error');
            }
        }
        
        // 修改血量（通用）
        async function modifyBlood() {
            const playerNo = document.getElementById('modPlayer').value;
            const amount = document.getElementById('modAmount').value;
            const note = document.getElementById('modNote').value;
            
            const response = await fetch('/api/modify_blood', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    player_no: parseInt(playerNo),
                    amount: parseInt(amount),
                    note: note
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showMessage('血量修改成功');
                updatePlayersGrid(data.players);
            } else {
                showMessage(data.message, 'error');
            }
        }
        
        // 加载拍卖卡牌
        async function loadAuctionCards() {
            const response = await fetch('/api/get_evolution_cards');
            const data = await response.json();
            
            if (data.success) {
                const auctionList = document.getElementById('auctionList');
                auctionList.innerHTML = '';
                
                const cards = data.cards[currentRound] || [];
                const availableCards = cards.filter(c => c.owner === null);
                
                if (availableCards.length === 0) {
                    auctionList.innerHTML = '<p>本轮没有可拍卖的进化卡</p>';
                    return;
                }
                
                availableCards.forEach(card => {
                    const item = document.createElement('div');
                    item.className = 'auction-item';
                    item.innerHTML = `
                        <span>${card.card_id} ${card.name}</span>
                        <div class="inline-form">
                            <input type="number" id="bidder_${card.card_id}" placeholder="玩家编号" min="1" style="width: 80px;">
                            <input type="number" id="price_${card.card_id}" placeholder="血量" min="1" style="width: 80px;">
                            <button onclick="auctionCard('${card.card_id}')" class="small-btn">竞拍</button>
                        </div>
                    `;
                    auctionList.appendChild(item);
                });
            }
        }
        
        // 拍卖进化卡
        async function auctionCard(cardId) {
            const playerNo = document.getElementById(`bidder_${cardId}`).value;
            const bloodCost = document.getElementById(`price_${cardId}`).value;
            
            const response = await fetch('/api/auction_card', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    card_id: cardId,
                    player_no: parseInt(playerNo),
                    blood_cost: parseInt(bloodCost)
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showMessage(data.message);
                updatePlayersGrid(data.players);
                loadAuctionCards();
            } else {
                showMessage(data.message, 'error');
            }
        }
    </script>
</body>
</html>
